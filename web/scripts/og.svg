<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- suslicke.com default OG image (source for public/og.png).
       Palette = the site's dark "evening blue" theme (globals.css):
       bg #181d2e, warm light foreground, terracotta accent #d98d5f. -->
  <defs>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d98d5f"/>
      <stop offset="0.55" stop-color="#e8c9a8"/>
      <stop offset="1" stop-color="#ede6d6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#2a3049"/>
      <stop offset="1" stop-color="#181d2e"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- large faint QR-voxel motif, right side (echoes the favicon mark) -->
  <g fill="#d98d5f" opacity="0.14" transform="translate(760,95) scale(13.75)">
    <path d="M5 5h9v9H5zm2 2v5h5V7z"/>
    <path d="M18 5h9v9h-9zm2 2v5h5V7z"/>
    <path d="M5 18h9v9H5zm2 2v5h5v-5z"/>
    <rect x="8" y="8" width="3" height="3"/>
    <rect x="21" y="8" width="3" height="3"/>
    <rect x="8" y="21" width="3" height="3"/>
    <rect x="17" y="17" width="3" height="3"/>
    <rect x="22" y="19" width="3" height="3"/>
    <rect x="19" y="23" width="3" height="3"/>
    <rect x="24" y="24" width="3" height="3"/>
  </g>

  <!-- favicon tile, top-left -->
  <g transform="translate(88,84) scale(2.25)">
    <rect width="32" height="32" rx="7" fill="#f4ede0"/>
    <g fill="#a4512e">
      <path d="M5 5h9v9H5zm2 2v5h5V7z"/>
      <path d="M18 5h9v9h-9zm2 2v5h5V7z"/>
      <path d="M5 18h9v9H5zm2 2v5h5v-5z"/>
      <rect x="8" y="8" width="3" height="3"/>
      <rect x="21" y="8" width="3" height="3"/>
      <rect x="8" y="21" width="3" height="3"/>
      <rect x="17" y="17" width="3" height="3"/>
      <rect x="22" y="19" width="3" height="3"/>
      <rect x="19" y="23" width="3" height="3"/>
      <rect x="24" y="24" width="3" height="3"/>
    </g>
  </g>
  <text x="180" y="132" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="40" font-weight="600" fill="#ede6d6">suslicke</text>

  <!-- name + subtitle -->
  <text x="88" y="342" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="86" font-weight="700" letter-spacing="-1.5" fill="url(#name)">Andrei Pustovoi</text>
  <text x="88" y="420" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="42" font-weight="500" fill="#b9b2a4">Full Stack &amp; AI Developer</text>

  <!-- footer: url + accent rule -->
  <rect x="88" y="502" width="64" height="6" rx="3" fill="#d98d5f"/>
  <text x="88" y="556" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="32" font-weight="500" fill="#8f8a7d">suslicke.com</text>
</svg>
