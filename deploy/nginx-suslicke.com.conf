# suslicke.com — personal site (web :18000) + suslicke-hub (:18001).
# Cert: certbot webroot (HTTP-01), auto-renews via certbot.timer.

server {
    listen 80;
    listen [::]:80;
    server_name suslicke.com www.suslicke.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://suslicke.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name suslicke.com;

    ssl_certificate     /etc/letsencrypt/live/suslicke.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/suslicke.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # The shirt QR must never dead-end: if hub is down, nginx itself redirects.
    location = /qr {
        proxy_pass http://127.0.0.1:18001;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_intercept_errors on;
        error_page 502 503 504 = @qr_fallback;
    }
    location @qr_fallback {
        return 307 /?utm_source=shirt&utm_medium=offline&utm_campaign=networking;
    }

    location /hub {
        proxy_pass http://127.0.0.1:18001;
        proxy_set_header X-Forwarded-For $remote_addr;
        # Event-image uploads: app rejects >5 MB with a friendly notice, so
        # give it headroom; also caps the global (http-level) 500m default
        # so huge bodies never reach the hub.
        client_max_body_size 6m;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18001;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
